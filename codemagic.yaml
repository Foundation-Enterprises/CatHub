workflows:
  multi-platform-release:
    name: Build iOS & Deploy to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: Codemagic Latest

    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "com.foundation.cathub"
        XCODE_PROJECT: "CatHub.xcodeproj"
        IOS_SCHEME: "CatHub"
      xcode: latest

    scripts:
      - name: Initialize Keychains
        script: |
          keychain initialize

      - name: Fetch signing files from App Store Connect
        script: |
          # Uses your Codemagic integration API key to fetch/create the exact profiles needed
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings in Xcode project
        script: |
          xcode-project use-profiles

      - name: Set Versioning from Git Tag
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all "$CM_BUILD_NUMBER"

          if [ -n "$CM_TAG" ]; then
            MARKETING_VERSION="${CM_TAG#v}"
            agvtool new-marketing-version "$MARKETING_VERSION"
          else
            echo "No CM_TAG on this build — skipping marketing version bump."
          fi

      - name: Build & Package iOS IPA
        script: |
          cd "$CM_BUILD_DIR"
          # This Codemagic wrapper handles the complex xcodebuild export options automatically
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$IOS_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
          - External Testers
