workflows:
  multi-platform-release:
    name: Build iOS & Deploy to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      # Must exactly match the App Store Connect integration name
      # configured in Codemagic → Team settings → Integrations
      app_store_connect: Codemagic Latest

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "Foundation.CatHub"
        XCODE_PROJECT: "CatHub.xcodeproj"
        IOS_SCHEME: "CatHub"
      xcode: latest

    scripts:
      - name: Initialize Keychains & Fetch Signing Files
        script: |
          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # If CatHub has extra targets (widget, extension, watch app, etc.)
          # with their own bundle IDs, repeat fetch-signing-files for each one
          # here before running use-profiles below.

          keychain add-certificates
          xcode-project use-profiles

      - name: Set Versioning from Git Tag
        script: |
          cd $CM_BUILD_DIR

          # CM_BUILD_NUMBER is Codemagic's real auto-incrementing build number.
          # (The previous $BUILD_NUMBER was never defined, so it silently
          # evaluated to 0 every build.)
          agvtool new-version -all "$CM_BUILD_NUMBER"

          # Strip the leading "v" from a tag like v1.4.0 -> 1.4.0 and use it
          # as the marketing version, since releases are tag-triggered.
          MARKETING_VERSION="${CM_TAG#v}"
          agvtool new-marketing-version "$MARKETING_VERSION"

      - name: Build & Package iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$IOS_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
          - External Testers
