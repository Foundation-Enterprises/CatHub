workflows:
  multi-platform-release:
    name: Build macOS (Notarized) & iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: CatHub_ASC # Ensure this matches your Codemagic integration name

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "com.Foundation.CatHub"
        # Swapped to .xcodeproj since workspace doesn't exist
        XCODE_PROJECT: "CatHub.xcodeproj" 
        IOS_SCHEME: "CatHub-iOS"
        MAC_SCHEME: "CatHub-macOS"
      xcode: latest

    scripts:
      - name: Initialize Keychains & Force Create Provisioning Profiles
        script: |
          keychain initialize
          
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
            
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type MAC_APP_DIRECT \
            --create
            
          keychain add-certificates
          xcode-project use-profiles

      - name: Set Versioning from Git Tag
        script: |
          cd $CM_BUILD_DIR
          BUILD_VER="${CM_TAG:-1.0.$BUILD_NUMBER}"
          agvtool new-version -all $(($BUILD_NUMBER))

      - name: Build & Package iOS IPA
        script: |
          # Changed --workspace to --project
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$IOS_SCHEME" \
            --config Release

      - name: Build, Archive & Notarize macOS App
        script: |
          # Changed -workspace to -project
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$MAC_SCHEME" \
            -configuration Release \
            -archivePath build/macos/CatHub.xcarchive

          xcodebuild -exportArchive \
            -archivePath build/macos/CatHub.xcarchive \
            -exportOptionsPlist macos_export_options.plist \
            -exportPath build/macos/output

          ditto -c -k --keepParent "build/macos/output/CatHub.app" "build/macos/output/CatHub.zip"

          xcrun notarytool submit "build/macos/output/CatHub.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "build/macos/output/CatHub.app"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/macos/output/CatHub.app
      - build/macos/output/CatHub.zip
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
          - External Testers
