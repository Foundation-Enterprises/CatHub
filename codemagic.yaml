workflows:
  multi-platform-release:
    name: Build iOS & Deploy to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: Codemagic Latest # Ensure this matches your Codemagic integration name

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "com.Foundation.CatHub"
        XCODE_PROJECT: "CatHub.xcodeproj" 
        IOS_SCHEME: "CatHub"
      xcode: latest

    scripts:
      - name: Initialize Keychains & Fetch Signing Files
        script: |
          keychain initialize
          
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          xcode-project use-profiles

      - name: Set Versioning from Git Tag
        script: |
          cd $CM_BUILD_DIR
          BUILD_VER="${CM_TAG:-1.0.$BUILD_NUMBER}"
          agvtool new-version -all $(($BUILD_NUMBER))

      - name: Build & Package iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$IOS_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
          - External Testers
